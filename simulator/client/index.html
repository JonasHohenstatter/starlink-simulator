<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEO Constellation Simulator</title>
        <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+" crossorigin="anonymous"></script>
        
        <link rel="stylesheet" href="client/styles.css"/>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
        
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/leaflet.geodesic"></script>
    <body>
        <div class="sim-container">
            <div class="map-container">
              <div id="map" style="height: 100vh; width: 100vh"></div>
            </div>
            <div class="divider bg-tumblue"></div>
            <div class="controls-container">
              <h2 class="website-heading">Real-Time LEO Constellation Simulator</h1>
              <div class="horizontal-divider bg-tumblue"></div>
              <div>
                <form id="constellation_form" class="form-grid">
                  
                  <h4 class="section-heading">Constellation
                  </h4>
                  <div>
                    <button class="form-el" type="submit">Update</button>
                  </div>

                  <label for="constellationSelect">Select Constellation:</label>
                  <select id="constellationSelect" class="form-el">
                    <option value="starlink">Starlink</option>
                    <option value="oneweb">OneWeb</option>
                    <option value="iridium">Iridium</option>
                    <option value="kuiper">Kuiper</option>
                  </select>

                </form>
              </div>
              <div class="horizontal-divider bg-tumblue"></div>
              <div>
                <form id="dish_form" class="form-grid">

                  <h4 class="section-heading">Home Dish</h4>
                  <div>
                    <button class="form-el" type="submit">Update</button>
                  </div>
                  
                  <label>Elevation:</label>
                  <span><input id="input_elevation" class="form-el" value="25" type="number" min="10" max="90" >°</span>

                </form>
              </div>
              <div class="horizontal-divider bg-tumblue"></div>
              <div>
                <form id="gs_form" class="form-grid">

                  <h4 class="section-heading">Ground stations</h4>
                  <div>
                    <button class="form-el" type="submit">Update</button>
                  </div>

                  <label for="gsSelect">Load config:</label>
                  <select id="gsSelect" class="form-el">
                    <option value="">None</option>
                    <option value="starlink">Starlink GS</option>
                  </select>

                  <label>Remove all:</label>
                  <button class="form-el" id="remove_all_gs">Delete</button>

                </form>
              </div>
              <div class="horizontal-divider bg-tumblue"></div>
              <div>
                <form id="emulation_form" class="form-grid">

                  <h4 class="section-heading">Emulation</h4>
                  <div>
                    <button class="form-el" type="submit">Start Emulation</button>
                  </div>
                </form>
              </div>
            </div>

        </div>
        <div id="controls">
          <button  class="control-button" id="homeDishBtn">🏠</button>
          <button  class="control-button" id="gsBtn">📡</button>
        </div>
        
  </body>
  <script src="client/index.js"></script>
</html>
